<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{background:#161617;color:#d3d0ca;font-family:"Pretendard","Malgun Gothic",sans-serif;width:1400px;height:820px;overflow:hidden}
.pc{display:flex;flex-direction:column;height:100%;padding:14px 18px 18px;gap:14px}
header{display:flex;align-items:flex-start;gap:16px;height:71px}
.logo{font-size:24px;font-weight:700}.logo b{color:#ef4444}
.sub{font-size:11px;color:#a39f98;margin-top:6px;display:flex;gap:6px;align-items:center}
.led{width:6px;height:6px;border-radius:9px;background:#7ed957;box-shadow:0 0 6px #7ed95788}
.strip{flex:1;display:flex;gap:8px;margin-left:12px}
.person{width:72px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#a39f98}
.person i{width:38px;height:38px;border-radius:50%;background:#55524e;display:block}
.knobs{display:flex;gap:20px;align-items:flex-end}
.knob{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:#a39f98}
.cap{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#d6d3cd;
 background:radial-gradient(circle at 50% 32%,#353537,#19191a 66%,#111112);box-shadow:0 0 0 1px #000,0 0 0 3px #1b1b1c,0 0 0 4px #ffffff10}
.knob .l{width:6px;height:6px;border-radius:9px;background:#33312f}
.knob.on .l{background:#7ed957;box-shadow:0 0 6px #7ed957}
.knob.new .cap{outline:2px dashed #e8b46a;outline-offset:6px}
.knob.new{color:#e8b46a}
svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.main{flex:1;display:grid;grid-template-columns:1fr 440px;gap:18px;min-height:0}
.left{display:flex;flex-direction:column;gap:10px;min-height:0}
.share{position:relative;flex:1;border-radius:12px;background:linear-gradient(135deg,#2b3a55,#1d2533 60%,#30263a);overflow:hidden;min-height:0}
.share .game{position:absolute;inset:0;display:grid;place-items:center;color:#ffffff30;font-size:40px;font-weight:700}
.chat{background:#1e1e21;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.msg{background:#2a2a2d;border-radius:10px;padding:8px 10px;width:fit-content;color:#c9c6c0}
.input{margin-top:auto;height:44px;border-radius:10px;background:#141415}
.face{position:relative;border-radius:10px;overflow:hidden;background:#3a3f47;aspect-ratio:16/9}
.face:before{content:"";position:absolute;left:50%;top:22%;width:26%;aspect-ratio:1;border-radius:50%;background:#7a8290;transform:translateX(-50%)}
.face:after{content:"";position:absolute;left:50%;bottom:-18%;width:56%;height:46%;border-radius:50% 50% 0 0;background:#7a8290;transform:translateX(-50%)}
.face span{position:absolute;left:6px;bottom:5px;z-index:2;font-size:11px;background:#000a;padding:1px 6px;border-radius:4px;color:#eee}
.face.talk{box-shadow:inset 0 0 0 2px #4ade80}
.more{display:grid;place-items:center;border-radius:10px;background:#2a2a2d;color:#d3d0ca;font-size:15px;aspect-ratio:16/9}
.tag{position:absolute;top:10px;left:10px;font-size:13px;background:#e8b46a;color:#1a1a1a;padding:3px 10px;border-radius:6px;font-weight:700;z-index:5}
.note{position:fixed;bottom:6px;left:18px;font-size:13px;color:#e8b46a}
/* 휴대폰 */
.phone{width:390px;height:780px;margin:20px auto;border-radius:30px;border:6px solid #000;background:#18181b;overflow:hidden;display:flex;flex-direction:column}
.ph{height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #27272a;font-size:13px}
.badge{background:#27272a;border-radius:99px;padding:4px 12px}
.pk{margin-left:auto;display:flex;gap:10px}
.pk i{width:30px;height:30px;border-radius:50%;background:#27272a;display:grid;place-items:center;color:#ddd}
.pk i.new{outline:2px dashed #e8b46a;outline-offset:3px;color:#e8b46a}
</style></head><body>
<script>
const v = new URLSearchParams(location.search).get("v") || "1";
const cam = `<path d="M15 10l5-3v10l-5-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/>`;
const ic = {
 full:`<path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/>`,
 share:`<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>`,
 tts:`<path d="M4 7h16M12 7v12"/>`,
 mic:`<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>`,
};
const knob=(k,l,cls="")=>`<div class="knob ${cls}"><div class="cap"><svg viewBox="0 0 24 24">${k}</svg></div><span>${l}</span><span class="l"></span></div>`;
const names=["나","민수","지은","하늘","도윤","서아","준호","유나","태양","별이","시우","다온"];
const faces=(n,talk=1)=>names.slice(0,n).map((x,i)=>`<div class="face ${i==talk?"talk":""}"><span>${x}</span></div>`).join("");
const header=`<header><div><div class="logo">DO<b>LIVE</b></div><div class="sub"><span class="led"></span>참여 12명</div></div>
<div class="strip">${names.slice(0,8).map(x=>`<div class="person"><i></i>${x}</div>`).join("")}</div>
<div class="knobs">${knob(ic.full,"전체화면")}${knob(ic.share,"화면공유")}${knob(ic.tts,"TTS")}${knob(cam,"카메라","new on")}${knob(ic.mic,"마이크","on")}</div></header>`;
const chat=`<div class="chat"><div class="msg">ㅋㅋㅋ 얼굴 보인다</div><div class="msg">카메라 켜 봤어요</div><div class="msg">화질 괜찮네</div><div class="input"></div></div>`;
let left="", tag="", note="";
if(v==="1"){ tag="시안 1. 공유 화면 위에 겹치기";
 left=`<div class="share"><div class="game">화면공유 (게임 화면)</div>
 <div style="position:absolute;right:12px;bottom:12px;width:200px;display:flex;flex-direction:column;gap:8px">${faces(3)}<div class="more">+5명 더 보기</div></div></div>`;
 note="공유 화면 크기는 그대로. 얼굴은 오른쪽 아래에 3개까지 겹쳐 띄우고 나머지는 '+5명'. 얼굴이 게임 화면 일부를 가림";}
if(v==="2"){ tag="시안 2. 공유 화면 아래 얼굴 줄";
 left=`<div class="share"><div class="game">화면공유 (게임 화면)</div></div>
 <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:128px">${faces(5)}<div class="more">+3명</div></div>`;
 note="얼굴이 공유 화면을 가리지 않음. 대신 공유 화면이 조금 작아짐. 한 줄에 6칸, 넘치면 '+3명'";}
if(v==="3"){ tag="시안 3. 공유가 없을 때: 얼굴 바둑판";
 left=`<div style="flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:10px;min-height:0">${faces(6)}</div>`;
 note="화면공유가 없으면 'LIVE 방송 준비 중' 자리에 카메라 켠 사람들을 크게. 9명 넘으면 '+N명'";}
if(v==="4"){
 document.body.style.width="1400px";
 document.body.innerHTML=`<div style="display:flex;gap:40px;justify-content:center">
 ${[["시안 4-가. 휴대폰: 공유 아래 얼굴 줄",true],["시안 4-나. 휴대폰: 공유 없을 때",false]].map(([t,s])=>`<div><div style="color:#e8b46a;font-weight:700;text-align:center;margin-top:14px">${t}</div>
 <div class="phone"><div class="ph"><b>DO<span style="color:#ef4444">LIVE</span></b><span class="badge">참여 12명</span>
 <div class="pk"><i><svg viewBox="0 0 24 24">${ic.tts}</svg></i><i class="new"><svg viewBox="0 0 24 24">${cam}</svg></i><i><svg viewBox="0 0 24 24">${ic.mic}</svg></i></div></div>
 ${s?`<div style="margin:8px;aspect-ratio:16/9;border-radius:12px;background:linear-gradient(135deg,#2b3a55,#30263a);display:grid;place-items:center;color:#ffffff40;font-weight:700">화면공유</div>
 <div style="display:flex;gap:6px;padding:0 8px;overflow:hidden">${names.slice(0,4).map((x,i)=>`<div class="face ${i==1?"talk":""}" style="width:110px;flex:none"><span>${x}</span></div>`).join("")}</div>`
 :`<div style="margin:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px">${faces(4)}</div>`}
 <div style="flex:1;margin:8px;border-radius:12px;background:#1e1e21;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:13px"><div class="msg">얼굴 보인다</div><div class="msg">ㅎㅇ</div><div class="input" style="height:40px"></div></div>
 </div></div>`).join("")}</div>
 <div class="note">얼굴 줄은 옆으로 밀어서 더 봄. 휴대폰은 한 번에 4명까지만 받아서 데이터·배터리를 아낌</div>`;
} else {
 document.body.innerHTML=`<div class="pc">${header}<div class="main"><div class="left" style="position:relative"><div class="tag">${tag}</div>${left}</div>${chat}</div></div><div class="note">${note}  ·  점선 = 새로 생기는 카메라 버튼</div>`;
}
</script></body></html>
