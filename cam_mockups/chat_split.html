<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
:root{--gold:#d1b77f;--selBg:#393631;--selLine:#75664b}
body{width:1400px;height:860px;overflow:hidden;font-family:"Pretendard","Malgun Gothic",sans-serif;color:#d6d3cd;background:radial-gradient(120% 90% at 30% 20%,#232325,#121213)}
.tag{position:absolute;top:22px;left:28px;font-size:15px;font-weight:700;color:#e8b46a}
.sub{position:absolute;top:46px;left:28px;right:28px;font-size:12px;color:#8d8983}
.stage{position:absolute;inset:80px 0 0;display:flex;justify-content:center;gap:48px}
.cap{text-align:center;color:#e8b46a;font-weight:700;font-size:13px;margin-bottom:10px}
.win{width:360px;height:640px;border-radius:10px;overflow:hidden;background:#18181b;box-shadow:0 20px 60px #000a;border:1px solid #333;display:flex;flex-direction:column}
.bar{height:30px;background:#2b2b2e;display:flex;align-items:center;padding:0 10px;font-size:11px;color:#9a9a9a;gap:8px}
.bar b{margin-left:auto;letter-spacing:6px;color:#bbb}
.top{position:relative;aspect-ratio:16/9;background:#000;flex:none}
.top img.face{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;transform:scaleX(-1)}
.screen{position:absolute;inset:0;background:linear-gradient(135deg,#2c3a52,#2a2436)}
.screen .g{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff05 0 2px,transparent 2px 6px)}
.screen .t{position:absolute;inset:0;display:grid;place-items:center;color:#ffffff40;font-weight:800;font-size:22px}
.ov{position:absolute;right:2%;bottom:2%;width:22%;aspect-ratio:16/9;border-radius:5px;overflow:hidden;box-shadow:0 4px 10px #0008}
.ov img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;transform:scaleX(-1)}
.pick{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;gap:3px;padding:3px;border-radius:999px;background:#000000b3;backdrop-filter:blur(6px);box-shadow:0 0 0 1px #ffffff1a}
.pick span{white-space:nowrap;height:26px;padding:0 11px;border-radius:999px;display:flex;align-items:center;gap:5px;font-size:11.5px;color:#b5b0aa}
.pick span.on{background:var(--selBg);color:var(--gold);box-shadow:0 0 0 1px var(--selLine)}
.pick svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chat{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.m{display:flex;gap:8px;align-items:flex-start}
.m i{width:28px;height:28px;border-radius:50%;background:#55524e;flex:none}
.m p{background:#2a2a2d;border-radius:10px;padding:7px 10px;color:#c9c6c0}
.m small{display:block;font-size:11px;color:#8d8983;margin-bottom:3px}
.input{height:44px;margin:10px;border-radius:12px;background:#232326}
.hint{position:absolute;font-size:12px;color:#8d8983}
</style></head><body>
<div class="tag">채팅 분리 창: 위쪽 화면에 마우스를 올리면 [내 얼굴] / [시청자 화면] 고르기</div>
<div class="sub">마우스를 치우면 고르기 버튼은 사라지고 화면만 남음 (공유 화면의 전체화면 버튼처럼). 고른 것은 다음에 열어도 그대로</div>
<div class="stage" id="st"></div>
<script>
const IMG = "../assets/profile/2.webp";
const face = '<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>';
const scr = '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>';
const chat = `<div class="chat">
  <div class="m"><i></i><p><small>민수</small>ㅋㅋㅋ 얼굴 보인다</p></div>
  <div class="m"><i></i><p><small>지은</small>오늘 보스 잡나요?</p></div>
  <div class="m"><i></i><p><small>하늘</small>화질 좋네</p></div>
</div><div class="input"></div>`;
const win = (mode, hover) => `<div class="win"><div class="bar">localhost · DOLIVE<b>— ✕</b></div>
  <div class="top">${mode === "face" ? `<img class="face" src="${IMG}">` : `<div class="screen"><div class="g"></div><div class="t">GAME SCREEN</div><div class="ov"><img src="${IMG}"></div></div>`}
  ${hover ? `<div class="pick"><span class="${mode === "face" ? "on" : ""}">${face}내 얼굴</span><span class="${mode === "view" ? "on" : ""}">${scr}시청자 화면</span></div>` : ""}</div>${chat}</div>`;
document.getElementById("st").innerHTML = [
  ["내 얼굴 (마우스를 올렸을 때)", win("face", true)],
  ["시청자 화면 (마우스를 올렸을 때)", win("view", true)],
  ["시청자 화면 (마우스를 치웠을 때)", win("view", false)],
].map(([c, w]) => `<div><div class="cap">${c}</div>${w}</div>`).join("");
</script></body></html>
